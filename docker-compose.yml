name: dome-platform

services:
  web:
    build: .
    image: dome-platform-web
    environment:
      PORT: 8080
      DATA_DIR: /app/data
    ports:
      # 宿主机端口可配置：WEB_PORT=9000 docker compose up
      - "${WEB_PORT:-8080}:8080"
    volumes:
      # 事件轨迹持久化（只增 JSONL）
      - dome-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # 一次性验收服务：代码测试 + 构建 + 几何业务冒烟，结束后自行退出，
  # 退出码即验收结果（0 = 通过）。
  verify:
    image: dome-platform-web
    build: .
    depends_on:
      web:
        condition: service_healthy
    environment:
      SMOKE_BASE_URL: http://web:8080
    command: ["npm", "run", "verify"]
    restart: "no"

volumes:
  dome-data:
